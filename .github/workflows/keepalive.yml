name: Supabase Keepalive

on:
  schedule:
    # 12:40 MESZ im Sommer / 11:40 MEZ im Winter
    - cron: '40 10 * * *'

  # Ermöglicht zusätzlich einen manuellen Start
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:

      - name: Datenbank - Teams
        run: |
          curl -f \
            "https://xatrfibydbpqmqxctfpr.supabase.co/rest/v1/teams?select=id&limit=10" \
            -H "apikey: ${{ secrets.SUPABASE_ANON }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON }}"

      - name: Datenbank - Tasks
        run: |
          curl -f \
            "https://xatrfibydbpqmqxctfpr.supabase.co/rest/v1/tasks?select=id&limit=10" \
            -H "apikey: ${{ secrets.SUPABASE_ANON }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON }}"

      - name: Datenbank - Schedule
        run: |
          curl -f \
            "https://xatrfibydbpqmqxctfpr.supabase.co/rest/v1/schedule?select=id&limit=10" \
            -H "apikey: ${{ secrets.SUPABASE_ANON }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON }}"

      - name: Datenbank - Submissions
        run: |
          curl -f \
            "https://xatrfibydbpqmqxctfpr.supabase.co/rest/v1/submissions?select=id&limit=10" \
            -H "apikey: ${{ secrets.SUPABASE_ANON }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON }}"
